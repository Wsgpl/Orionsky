services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --save 300 10
      --save 900 1
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: python:3.12.3-slim
    restart: unless-stopped
    working_dir: /app
    env_file: .env
    environment:
      REDIS_HOST: redis
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
      VIRTUAL_ENV: /opt/venv
    volumes:
      - ./:/app
      - api_venv:/opt/venv
      - api_pip_cache:/root/.cache/pip
    command:
      - /bin/sh
      - -lc
      - |
          set -e
          if [ ! -x /opt/venv/bin/python ]; then
            python -m venv /opt/venv
          fi
          REQ_HASH="$$(sha256sum requirements.txt | awk '{print $$1}')"
          STAMP="/opt/venv/.requirements-sha"
          if [ ! -f "$$STAMP" ] || [ "$$(cat "$$STAMP")" != "$$REQ_HASH" ]; then
            /opt/venv/bin/pip install --upgrade pip wheel
            /opt/venv/bin/pip install -r requirements.txt
            printf '%s' "$$REQ_HASH" > "$$STAMP"
          fi
          exec /opt/venv/bin/gunicorn -c gunicorn.conf.py app.main:app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  redis_data:
    driver: local
  api_venv:
    driver: local
  api_pip_cache:
    driver: local
